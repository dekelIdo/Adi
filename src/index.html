    <!-- THE FIRST THING MOST PEOPLE SEE IS NOT THIS PAGE.

         description are the ones already on this page, and the image is the
         hero photograph the site already ships. -->

    <meta property="og:site_name" content="עדי אריאלי · Social-Li" />
    <meta property="og:locale" content="he_IL" />

         rather than as a thumbnail beside the text. -->
